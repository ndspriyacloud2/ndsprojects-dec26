apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod-2
  labels:
    app: nginx
    env: dev
spec:
  containers:
  - name: nginx-container-2
    image: nginx
    resources:
      limits:
        cpu: "500m"
        memory: "500Mi"
      requests:
        cpu: "200m"
        memory: "200Mi"
    ports:
    - name: nginx-port
      containerPort: 80
      protocol: TCP
    env:
    - name: db_user
      value: vmall@123
    volumeMounts:
    - name: nginx-data
      mountPath: /usr/share/nginx/html
  volumes:
  - name: nginx-data
    emptyDir: {}

