apiVersion: v1
kind: Pod
metadata:
  name: multi-pod1
  labels:
    app: nginx
    env: dev
spec:
  containers:
  - name: nginx-container-1
    image: nginx
    ports:
    - name: nginx-port
      containerPort: 80
      protocol: TCP
    resources:
      limits:
        cpu: "500m"
        memory: "500Mi"
      requests:
        cpu: "200m"
        memory: "200Mi"
    env:
    - name: db_nginx
      value: vmall@123
    volumeMounts:
    - name: nginx-multi-data
      mountPath: /usr/share/nginx/html
  - name: alpine-container-1
    image: alpine
    command: ["/bin/sh"]
    args: ["-c", "while true ;do date >> /var/tmp/index.html; sleep 10; done"]
    volumeMounts:
    - name: nginx-multi-data
      mountPath: /var/tmp 
  volumes:
  - name: nginx-multi-data
    emptyDir: {}

