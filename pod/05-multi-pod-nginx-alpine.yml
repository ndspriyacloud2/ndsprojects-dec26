apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app: nginx
    env: dev
spec:
  containers:
  - name: nginx-container
    image: nginx
    ports:
    - name: nginx-port
      containerPort: 80
      protocol: TCP
    env:
    - name: DB_USER
      value: user
    - name: DB_PASSWORD 
      value: password@123
    resources:
      requests:
        cpu: 200m
        memory: 200Mi
      limits:
        cpu: 500m
        memory: 500Mi
    volumeMounts:
    - name: nginx-data
      mountPath: /usr/share/nginx/html
  - name: alpine-container
    image: alpine
    command: ["/bin/sh"]
    args: ["-c", "while true; do date >> /var/tmp/index.html; sleep 10; done"]
    volumeMounts:
    - name: nginx-data
      mountPath: /var/tmp 
  volumes:
  - name: nginx-data
    emptyDir: {}

