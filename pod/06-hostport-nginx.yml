apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
spec:
  containers:
  - name: nginx-container
    image: nginx
    ports:
    - name: nginx-port
      containerPort: 80
      protocol: TCP
      hostPort: 8090
    resources:
      requests:
        cpu: 200m
        memory: 200Mi
      limits:
        cpu: 500m
        memory: 500Mi
    volumeMounts:
    - name: nginx-backup
      mountPath: /usr/share/nginx/html
  - name: alpine-container
    image: alpine
    command: ["/bin/sh"]
    args: ["-c", "while true; do date  >> /var/tmp/index.html; sleep 10; done"]
    volumeMounts:
    - name: nginx-backup
      mountPath: /var/tmp/
  volumes:
  - name: nginx-backup
    emptyDir: {}
